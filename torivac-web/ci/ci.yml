# Integración continua de torivac-web. COPIAR a .github/workflows/ci.yml en la raíz del repositorio de la web
# (GitHub solo lee workflows de la raíz; en el monorepo de trabajo viven aquí como plantilla). Ajusta `working-directory` si la web no está en torivac-web/.
name: ci
on:
  pull_request:
  push:
    branches: [main]
defaults:
  run:
    working-directory: torivac-web
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'curl, mbstring, openssl, zlib' }
      - name: Escáner de secretos
        run: python3 -I scripts/secret_scan.py
      - name: Pruebas del Worker (pedidos, precios, hojas, lector de .xlsx, IA)
        run: cd workers/api && npm test
      - name: Pruebas del API PHP (mismo contrato que el Worker) y sintaxis de todos los .php
        run: |
          php backend-php/api/tests/run.php
          find backend-php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Compilar la web (demo, sin base) y con dominio (producción)
        run: |
          python3 -I scripts/build_prices.py --demo
          node site/build.mjs
          node site/build.mjs --base=https://${{ vars.SITE_HOST || 'demo.torivac.example' }} --out=/tmp/prod-dist
      - name: Auditoría SEO/GEO (JSON-LD, hreflang, sitemap, llms.txt, enlaces)
        run: python3 -I scripts/seo_check.py /tmp/prod-dist --base=https://${{ vars.SITE_HOST || 'demo.torivac.example' }}
      - name: Navegador (Playwright) · presupuesto, idioma, UX, accesibilidad, gráficos, panel y tarifa contra el Worker Y contra el PHP, y el paquete del hosting (cPanel/Plesk)
        run: |
          pip install openpyxl
          npm i --no-save playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
          export AXE_PATH=$PWD/node_modules/axe-core/axe.min.js
          node scripts/qa-quote.mjs && node scripts/qa-lang.mjs && node scripts/qa-art.mjs && node scripts/qa-theme.mjs
          node scripts/qa-ux.mjs && node scripts/qa-ux.mjs --mobile && node scripts/qa-a11y.mjs
          node site/build.mjs --theme=clasico   # segundo aspecto (Clásico): muestra de UX y accesibilidad completa
          node scripts/qa-ux.mjs --limit=80 --out=/tmp/qa-ux-clasico-d.json && node scripts/qa-ux.mjs --mobile --limit=80 --out=/tmp/qa-ux-clasico-m.json && node scripts/qa-a11y.mjs
          node site/build.mjs                   # y de nuevo el aspecto por defecto para el resto de pruebas
          node scripts/qa-live.mjs && node scripts/qa-admin-live.mjs && node scripts/qa-tarifa.mjs
          node scripts/qa-live.mjs --php && node scripts/qa-admin-live.mjs --php && node scripts/qa-tarifa.mjs --php
          node scripts/qa-package.mjs && node scripts/qa-update.mjs
          node scripts/perf.mjs --dir=/tmp/prod-dist
      - name: Índice de código (todo archivo con cabecera y cada función descrita)
        run: python3 -I scripts/gen_code_index.py --check
