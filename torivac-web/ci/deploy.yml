# Despliegue de torivac-web en un hosting con cPanel. COPIAR a .github/workflows/deploy-cpanel.yml (GitHub solo lee workflows de la raíz del repositorio).
# Genera el paquete con las mismas verificaciones que en local (scripts/package_cpanel.py), lo deja como artefacto descargable y,
# si se pide, lo sube por SSH con rsync (con simulacro previo). NUNCA sube ni toca api/config.php ni la carpeta de datos: viven solo en el servidor.
#
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL     URL pública del entorno, p. ej. https://pruebas.grupotorivac.com
#   SSH_HOST · SSH_PORT (22 por defecto) · REMOTE_DIR    solo para subir: p. ej. /home/CUENTA/public_html/pruebas
# Secretos (los mismos nombres en cada «environment»: pruebas y produccion):
#   SSH_USER · SSH_KEY (clave privada con acceso a ese usuario del hosting)
# El Worker de Cloudflare (alternativa al API PHP) se despliega aparte: ver workers/api/README.md.
name: deploy-cpanel
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno (pruebas lleva noindex y robots.txt cerrado)
        type: choice
        options: [pruebas, produccion]
        default: pruebas
      subir:
        description: Subir por SSH (si no, solo genera el .zip)
        type: boolean
        default: false
      simulacro:
        description: Simulacro (rsync -n) - enseña qué cambiaría sin tocar nada
        type: boolean
        default: true
      limpiar:
        description: Borrar del servidor lo que ya no esté en la web (rsync --delete; respeta api/config.php, la carpeta api/storage y .well-known)
        type: boolean
        default: false
defaults:
  run:
    working-directory: torivac-web
jobs:
  empaquetar-y-subir:
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'curl, mbstring, openssl, zlib' }
      - name: Pruebas previas (secretos, PHP, Worker)
        run: |
          python3 -I scripts/secret_scan.py
          php backend-php/api/tests/run.php
          cd workers/api && npm test
      - name: Empaquetar y verificar
        run: |
          test -n "${{ vars.SITE_URL }}" || { echo "Falta la variable SITE_URL"; exit 1; }
          python3 -I scripts/package_cpanel.py --base="${{ vars.SITE_URL }}" ${{ inputs.entorno == 'pruebas' && '--staging' || '' }} --keep --out=entrega
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-cpanel-${{ inputs.entorno }}
          path: torivac-web/entrega/*.zip
          if-no-files-found: error
      - name: Subir por SSH (rsync)
        if: ${{ inputs.subir }}
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
        run: |
          set -euo pipefail
          for v in SSH_USER SSH_KEY SSH_HOST REMOTE_DIR; do test -n "${!v}" || { echo "Falta $v"; exit 1; }; done
          case "$REMOTE_DIR" in /|~|/home|/home/|'') echo "REMOTE_DIR no es una carpeta de sitio"; exit 1;; esac
          install -m 700 -d ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          SRC="$(ls -d entrega/torivac-cpanel-*/ | head -1)"
          FLAGS="-az --human-readable --itemize-changes --exclude=/api/config.php --exclude=/api/storage/ --exclude=/.well-known/ --exclude=/cgi-bin/"
          ${{ inputs.limpiar && 'FLAGS="$FLAGS --delete"' || ':' }}
          ${{ inputs.simulacro && 'FLAGS="$FLAGS -n"' || ':' }}
          rsync $FLAGS -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" "$SRC" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
      - name: Comprobar que responde (solo si se subió de verdad)
        if: ${{ inputs.subir && !inputs.simulacro }}
        continue-on-error: true
        run: |
          curl -fsS "${{ vars.SITE_URL }}/api/health"
          curl -fsSI "${{ vars.SITE_URL }}/" | head -n 1
