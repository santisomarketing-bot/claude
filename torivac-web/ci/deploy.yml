# Despliegue de torivac-web: web estática en Cloudflare Pages + Worker torivac-api. COPIAR a .github/workflows/deploy.yml.
# Secretos del repositorio: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID · variables: SITE_HOST (dominio), API_URL (https://<worker>).
# Los secretos del Worker (RESEND_API_KEY, SESSION_SECRET, ADMIN_API_TOKEN, ANTHROPIC_API_KEY…) se cargan UNA vez con `wrangler secret put`.
name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['torivac-web/**']
defaults:
  run:
    working-directory: torivac-web
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Worker
        run: cd workers/api && npm i && npx wrangler deploy
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
      - name: Web (precios reales: la hoja de Drive manda; aquí solo se compila la estructura)
        run: |
          python3 -I scripts/build_prices.py --demo        # sustituir por --src=<hoja> cuando haya hoja real; el Worker publica los precios vivos
          TORIVAC_API=${{ vars.API_URL }} node site/build.mjs --base=https://${{ vars.SITE_HOST }}
      - name: Publicar en Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name torivac --branch main
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
